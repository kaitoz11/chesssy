# The checks that are too slow for every pull request: deep perft (about 465M
# nodes), the node count suite, and move agreement against a deep search.
#
# Runs weekly and on demand. The numbers are printed in the job log rather than
# compared automatically, because a shared runner's wall clock is not stable enough
# to gate on — node counts, which are exact, are what to read here.
#
# Actions are pinned to a commit SHA; see the notes at the top of ci.yml.
name: Weekly

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: deep verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Deep perft
        run: make perft-deep
      - name: Search node counts over forty positions
        run: make suite
      - name: Move agreement with a deep search
        run: make agreement
